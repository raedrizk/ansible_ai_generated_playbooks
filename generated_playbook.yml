---
- name: Install missing packages
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Install missing npm package
      community.general.npm:
        name: express
        path: /var/app/nodeapi
    - name: restart node-api.service
      ansible.builtin.service:
        name: node-api.service
        state: restarted
