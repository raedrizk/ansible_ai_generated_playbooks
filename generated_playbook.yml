---
- name: Install missing package and restart service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Install package
      community.general.npm:
        name: < missing package name >
        path: /var/app/nodeapi
    - name: Restart service
      ansible.builtin.service:
        name: node-api.service
        state: restarted
