---
- name: Install missing package and restart service
  hosts: all
  become: true
  gather_facts: false
  tasks:
    - name: Install the missing package
      community.general.npm:
        name: express
        path: /var/app/nodeapi
    - name: restart service
      ansible.builtin.systemd:
        state: restarted
        name: node-api.service
